name: Bot Execution

on:
  repository_dispatch:
    types: [bingx-trigger]
  workflow_dispatch:
    inputs:
      demo_mode_short:
        description: "Ejecutar la estrategia SHORT en cuenta DEMO (VST) en vez de cuenta real"
        required: true
        type: boolean
        default: false
      demo_mode_long:
        description: "Ejecutar la cuenta LONG en modo DEMO (VST) en vez de cuenta real"
        required: true
        type: boolean
        default: true
  schedule:
    # Cron INTERNO de GitHub, dedicado EXCLUSIVAMENTE al Paso 1 -- ver
    # BOT_MODE más abajo. Corre CADA HORA. NUNCA escanea ni abre nuevas
    # entradas. Es el ÚNICO disparador que revisa el Stop Loss en break
    # even del LONG (RUN_LONG_SL_TRACKING). Como schedule no es puntual, el
    # Stop Loss del SHORT (toque de EMA50(1h)) NO se ejecuta desde aquí --
    # ver RUN_STOP_LOSS_CHECK.
    - cron: "0 * * * *"

permissions:
  contents: write  # necesario para guardar los JSON de seguimiento del long en json/

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Serializa las ejecuciones para evitar órdenes TP/SL duplicadas
    # cuando el cron interno y el disparador externo caen a la vez.
    concurrency:
      group: bingx-trading-bot
      cancel-in-progress: false

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r utils/requirements.txt

      - name: Ejecutar bot
        env:
          BINGX_API_KEY: ${{ secrets.BINGX_API_KEY }}
          BINGX_API_SECRET: ${{ secrets.BINGX_API_SECRET }}
          BINGX_DEMO_SHORT: ${{ github.event.inputs.demo_mode_short || vars.BINGX_DEMO_SHORT || 'true' }}
          BINGX_DEMO_LONG: ${{ github.event.inputs.demo_mode_long || vars.BINGX_DEMO_LONG || 'true' }}
          # El cron interno (schedule) SOLO gestiona TP (Paso 1) de las
          # posiciones abiertas (cuentas short y long). Cualquier otro
          # disparador corre el bot completo.
          BOT_MODE: ${{ github.event_name == 'schedule' && 'tp_only' || 'full' }}
          # Barrido de balance futuros -> fondos: SOLO en disparador EXTERNO.
          RUN_BALANCE_CHECK: ${{ github.event_name == 'repository_dispatch' && 'true' || 'false' }}
          # Gatillo de Stop Loss (toque de EMA50(1h)): SOLO en
          # disparador EXTERNO. El Take Profit no depende de esta variable.
          RUN_STOP_LOSS_CHECK: ${{ github.event_name == 'repository_dispatch' && 'true' || 'false' }}
          # Seguimiento del Stop Loss en break even del LONG (se coloca al
          # romper el precio el máximo): SOLO en disparador INTERNO (schedule).
          # El seguimiento del Take Profit del long corre en TODOS los disparadores.
          RUN_LONG_SL_TRACKING: ${{ github.event_name == 'schedule' && 'true' || 'false' }}
        run: |
          set -o pipefail
          python bingx_bot.py 2>&1 | tee bot_output.log

      - name: Guardar seguimiento del long (JSON)
        if: always()
        run: |
          if [ -n "$(git status --porcelain json/)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add json/long_take_profit_tracking.json json/long_stop_loss_tracking.json
            git commit -m "chore: actualizar seguimiento del long [skip ci]"
            git pull --rebase origin "${{ github.ref_name }}" || true
            git push || echo "No se pudo hacer push del registro"
          fi

      - name: Enviar señales a Telegram
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          grep -E "Market entry executed|STOP-LIMIT order placed|Long LIMIT order placed|Orden LIMIT cancelada|Take Profit colocado|Stop Loss en break even.*colocado|Barrido de balance\] Transferencia ejecutada" bot_output.log > signals.txt || true
          if [ -s signals.txt ]; then
            MSG=$(cat signals.txt)
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
              --data-urlencode "text=📊 BingX Bot:
          ${MSG}"
          fi