name: Bot Execution

on:
  repository_dispatch:
    types: [bingx-trigger]
  workflow_dispatch:
    inputs:
      demo_mode_short:
        description: "Ejecutar la estrategia SHORT en cuenta DEMO (VST) en vez de cuenta real"
        required: true
        type: boolean
        default: false
      demo_mode_long:
        description: "Ejecutar la estrategia LONG en cuenta DEMO (VST) en vez de cuenta real"
        required: true
        type: boolean
        default: false
  schedule:
    # Cron INTERNO de GitHub, dedicado EXCLUSIVAMENTE a la gestión de
    # posiciones (Paso 1) -- ver BOT_MODE más abajo. Corre CADA HORA. NUNCA
    # escanea ni abre nuevas entradas. El Stop Loss en break even NO se
    # ejecuta desde aquí (ver RUN_STOP_LOSS_CHECK).
    - cron: "0 * * * *"

permissions:
  contents: write  # necesario para guardar los archivos de la carpeta json/

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: bingx-trading-bot
      cancel-in-progress: false

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r utils/requirements.txt

      - name: Ejecutar bot
        env:
          BINGX_API_KEY: ${{ secrets.BINGX_API_KEY }}
          BINGX_API_SECRET: ${{ secrets.BINGX_API_SECRET }}
          BINGX_DEMO_SHORT: ${{ github.event.inputs.demo_mode_short || vars.BINGX_DEMO_SHORT || 'true' }}
          BINGX_DEMO_LONG: ${{ github.event.inputs.demo_mode_long || vars.BINGX_DEMO_LONG || 'true' }}
          # Riesgo de TODAS las entradas (SHORT y LONG):
          # true = 5% de la cuenta | false = 10% de la cuenta.
          BINGX_LOW_RISK: ${{ vars.BINGX_LOW_RISK || 'true' }}
          # El cron interno (schedule) SOLO gestiona posiciones (Paso 1).
          BOT_MODE: ${{ github.event_name == 'schedule' && 'tp_only' || 'full' }}
          # Barrido de balance (Paso 15): SOLO en disparador EXTERNO.
          RUN_BALANCE_CHECK: ${{ github.event_name == 'repository_dispatch' && 'true' || 'false' }}
          # Gatillo de Stop Loss en break even (SHORT y LONG): SOLO en disparador EXTERNO.
          RUN_STOP_LOSS_CHECK: ${{ github.event_name == 'repository_dispatch' && 'true' || 'false' }}
        run: |
          set -o pipefail
          python bingx_bot.py 2>&1 | tee bot_output.log

      - name: Guardar seguimiento (carpeta json/)
        if: always()
        run: |
          if [ -n "$(git status --porcelain json/)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add json/
            git commit -m "chore: actualizar seguimiento json [skip ci]"
            git pull --rebase origin "${{ github.ref_name }}" || true
            git push || echo "No se pudo hacer push del registro"
          fi

      - name: Enviar señales a Telegram
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          grep -E "Market entry executed|(STOP-)?LIMIT order placed|Orden límite LONG cancelada|Stop Loss en break even.*colocado|Take Profit colocado.*reemplazo|Barrido de balance\] Transferencia ejecutada" bot_output.log > signals.txt || true
          if [ -s signals.txt ]; then
            MSG=$(cat signals.txt)
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
              --data-urlencode "text=📊 BingX Bot:
          ${MSG}"
          fi