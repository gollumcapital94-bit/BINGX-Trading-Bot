name: BingX Trading Bot - Pasos 1 a 14

on:
  repository_dispatch:
    types: [bingx-trigger]
  workflow_dispatch:
    inputs:
      demo_mode:
        description: "Ejecutar en cuenta DEMO (VST) en vez de cuenta real"
        required: true
        type: boolean
        default: true
  schedule:
    # Cron INTERNO de GitHub, dedicado EXCLUSIVAMENTE a la gestión de
    # TP/SL (Paso 1) -- ver BOT_MODE más abajo. Corre CADA HORA, en
    # sintonía con TIMEFRAME_TP="1h" en bingx_bot.py: el Paso 1 solo
    # evalúa velas 1h ya cerradas, así que revisar con más frecuencia
    # no aportaría datos nuevos hasta que cierre la siguiente vela.
    # NUNCA escanea ni abre nuevas entradas, así se evita duplicar una
    # posición que el disparador externo (cronjob.org ->
    # repository_dispatch) ya haya abierto.
    #
    # IMPORTANTE (Stop Loss): este cron interno de GitHub NO es
    # puntual -- schedule puede sufrir retrasos frente al minuto
    # exacto configurado, especialmente en horarios de alta demanda.
    # Por eso el Stop Loss (Gatillo 2 del Paso 1, toque de la
    # EMA50(1h)) ya NO se coloca desde este disparador -- ver
    # RUN_STOP_LOSS_CHECK más abajo. El Take Profit (Gatillo 1) sigue
    # evaluándose aquí sin cambios.
    - cron: "0 * * * *"

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # IMPORTANTE: serializa las ejecuciones de este workflow. Sin esto,
    # el cron interno (schedule) y el disparador externo (cronjob.org
    # -> repository_dispatch) podrían caer en el mismo instante y correr
    # EN PARALELO -- ambos verificarían "¿ya existe el TP/SL?" casi al
    # mismo tiempo, verían que no, y crearían la orden duplicada de
    # todos modos (el chequeo de duplicados en bingx_bot.py no es
    # atómico frente a corridas simultáneas). `cancel-in-progress:
    # false` hace que la segunda ejecución espere en cola a que termine
    # la primera, en vez de cancelarla o correr al mismo tiempo.
    concurrency:
      group: bingx-trading-bot
      cancel-in-progress: false

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar bot
        env:
          BINGX_API_KEY: ${{ secrets.BINGX_API_KEY }}
          BINGX_API_SECRET: ${{ secrets.BINGX_API_SECRET }}
          BINGX_DEMO: ${{ github.event.inputs.demo_mode || vars.BINGX_DEMO || 'true' }}
          # El cron interno (schedule) SOLO gestiona TP/SL (Paso 1).
          # Cualquier otro disparador -- manual (workflow_dispatch) o
          # externo (repository_dispatch desde cronjob.org) -- corre el
          # bot completo (Pasos 1 a 14), incluida la búsqueda de nuevas
          # entradas.
          BOT_MODE: ${{ github.event_name == 'schedule' && 'tp_only' || 'full' }}
          # Barrido de balance de futuros -> fondos (ver
          # check_and_sweep_futures_balance en bingx_bot.py): SOLO debe
          # correr cuando el disparador es el EXTERNO (cronjob.org ->
          # repository_dispatch) -- NUNCA en el cron interno de GitHub
          # (schedule, modo tp_only) ni en ejecuciones manuales
          # (workflow_dispatch). El propio bingx_bot.py además solo lo
          # ejecuta de verdad si BINGX_DEMO=false (mercado real).
          RUN_BALANCE_CHECK: ${{ github.event_name == 'repository_dispatch' && 'true' || 'false' }}
          # Gatillo del Stop Loss (Gatillo 2 del Paso 1, toque de la
          # EMA50(1h) -- ver process_position_tp en bingx_bot.py): SOLO
          # se activa cuando el disparador es el EXTERNO (cronjob.org
          # -> repository_dispatch), por ser más puntual que el cron
          # interno de GitHub (schedule), que puede sufrir retrasos.
          # NUNCA se activa en el cron interno (schedule) ni en
          # ejecuciones manuales (workflow_dispatch) -- así el Stop
          # Loss se coloca desde un único disparador, nunca desde dos
          # a la vez. El Take Profit (Gatillo 1) NO usa esta variable:
          # sigue evaluándose siempre, sin importar el disparador.
          RUN_STOP_LOSS_CHECK: ${{ github.event_name == 'repository_dispatch' && 'true' || 'false' }}
        run: |
          set -o pipefail
          python bingx_bot.py 2>&1 | tee bot_output.log

      - name: Enviar señales a Telegram
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          # NOTA: el patrón de "Stop Loss" usa ".*" entre "break even" y
          # "colocado" porque el log real dice "Stop Loss en break even
          # EXACTO colocado (gatillo: ...)" -- un patrón literal sin el
          # ".*" nunca hubiera hecho match y esa notificación de Telegram
          # jamás se habría disparado. El patrón de "Transferencia
          # ejecutada" notifica el barrido de balance de futuros -> fondos.
          grep -E "Market entry executed|Short STOP-LIMIT order placed|Take Profit colocado|Stop Loss en break even.*colocado|Barrido de balance\] Transferencia ejecutada" bot_output.log > signals.txt || true
          if [ -s signals.txt ]; then
            MSG=$(cat signals.txt)
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
              --data-urlencode "text=📊 BingX Bot:
          ${MSG}"
          fi