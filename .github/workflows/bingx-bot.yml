name: Bot Execution

on:
  repository_dispatch:
    types: [bingx-trigger]
  workflow_dispatch:
    inputs:
      demo_mode_short:
        description: "Ejecutar la estrategia SHORT en cuenta DEMO (VST) en vez de cuenta real"
        required: true
        type: boolean
        default: false
      demo_mode_long:
        description: "Ejecutar la estrategia LONG en cuenta DEMO (VST) en vez de cuenta real"
        required: true
        type: boolean
        default: false
  schedule:
    # Cron INTERNO de GitHub, dedicado EXCLUSIVAMENTE a la gestión de
    # posiciones (Paso 1) -- ver BOT_MODE más abajo. Corre CADA HORA. NUNCA
    # escanea ni abre nuevas entradas. El Stop Loss en break even NO se
    # ejecuta desde aquí (ver RUN_STOP_LOSS_CHECK).
    - cron: "0 * * * *"

permissions:
  contents: write  # necesario para guardar los archivos de la carpeta json/

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: bingx-trading-bot
      cancel-in-progress: false

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r utils/requirements.txt

      - name: Ejecutar bot
        env:
          BINGX_API_KEY: ${{ secrets.BINGX_API_KEY }}
          BINGX_API_SECRET: ${{ secrets.BINGX_API_SECRET }}
          BINGX_DEMO_SHORT: ${{ github.event.inputs.demo_mode_short || vars.BINGX_DEMO_SHORT || 'true' }}
          BINGX_DEMO_LONG: ${{ github.event.inputs.demo_mode_long || vars.BINGX_DEMO_LONG || 'true' }}
          # Riesgo de TODAS las entradas (SHORT y LONG):
          # true = 5% de la cuenta | false = 10% de la cuenta.
          BINGX_LOW_RISK: ${{ vars.BINGX_LOW_RISK || 'true' }}
          # El cron interno (schedule) SOLO gestiona posiciones (Paso 1).
          BOT_MODE: ${{ github.event_name == 'schedule' && 'tp_only' || 'full' }}
          # Barrido de balance (Paso 15, tope 30,000 USDT): SOLO en disparador EXTERNO.
          RUN_BALANCE_CHECK: ${{ github.event_name == 'repository_dispatch' && 'true' || 'false' }}
          # Gatillo de Stop Loss en break even (SHORT y LONG): SOLO en disparador EXTERNO.
          RUN_STOP_LOSS_CHECK: ${{ github.event_name == 'repository_dispatch' && 'true' || 'false' }}
        run: |
          set -o pipefail
          python bingx_bot.py 2>&1 | tee bot_output.log

      - name: Guardar seguimiento (carpeta json/)
        if: always()
        run: |
          if [ -n "$(git status --porcelain json/)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add json/
            git commit -m "chore: actualizar seguimiento json [skip ci]"
            for i in 1 2 3; do
              git pull --rebase origin "${{ github.ref_name }}" && git push && break
              sleep 3
            done || echo "No se pudo hacer push del registro"
          fi

      - name: Enviar señales y errores a Telegram
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          rm -f signals.txt

          # 1) Eventos de la operación + TODO error [ERROR] completo + advertencias importantes.
          #    Los "Error evaluando" del escáner se resumen aparte (pueden ser cientos).
          grep -E "Market entry executed|(STOP-)?LIMIT order placed|Orden límite LONG cancelada|\[LONG\]: la orden límite se llenó|Stop Loss en break even.*colocado|Take Profit colocado|Take Profit adjunto LÍMITE aceptado|Barrido de balance\] Transferencia ejecutada|no aceptó la entrada con Take Profit|no aceptó el TP adjunto|\[Límite de riesgo\] (BLOQUEADA|ADVERTENCIA)|no se pudo cancelar|BingX rechazó|no se pudo configurar el apalancamiento|\[ERROR\]" bot_output.log \
            | grep -v "Error evaluando" > signals.txt || true

          # 2) Resumen de errores del escáner (1 línea + ejemplo).
          N=$(grep -c "Error evaluando" bot_output.log || true)
          if [ "${N:-0}" -gt 0 ]; then
            {
              echo "⚠️ ${N} error(es) evaluando pares en el escáner. Primero:"
              grep -m1 "Error evaluando" bot_output.log
            } >> signals.txt
          fi

          # 3) Caída del bot por excepción no controlada: traceback con contexto.
          if grep -q "Traceback" bot_output.log; then
            {
              echo "💥 El bot se cayó con una excepción no controlada:"
              grep -A 15 "Traceback" bot_output.log
            } >> signals.txt
          fi

          if [ ! -s signals.txt ]; then
            echo "Telegram: no hubo líneas de señal ni errores en el log"
            exit 0
          fi

          # Telegram rechaza mensajes de más de 4096 caracteres: se parte en bloques
          # (máximo 4 mensajes por corrida para no llenar el chat).
          rm -f part_*
          split -C 3500 -d signals.txt part_
          TOTAL=$(ls part_* | wc -l)
          for f in $(ls part_* | head -4); do
            TEXT=$(printf '📊 BingX Bot:\n%s' "$(cat "$f")")
            RESP=$(curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
              --data-urlencode "text=${TEXT}")
            echo "Telegram: ${RESP}"
          done
          if [ "${TOTAL}" -gt 4 ]; then
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
              --data-urlencode "text=⚠️ Hubo más de 4 bloques de avisos; se omitieron $((TOTAL-4)). Revisa el log en GitHub." > /dev/null
          fi