name: Bot Execution

on:
  repository_dispatch:
    types: [bingx-trigger]
  workflow_dispatch:
    inputs:
      demo_mode_short:
        description: "Ejecutar la estrategia SHORT en cuenta DEMO (VST) en vez de cuenta real"
        required: true
        type: boolean
        default: false
      demo_mode_long:
        description: "Ejecutar la estrategia LONG en cuenta DEMO (VST) en vez de cuenta real"
        required: true
        type: boolean
        default: false
  schedule:
    # Cron INTERNO de GitHub, dedicado EXCLUSIVAMENTE a la gestión de
    # posiciones (Paso 1) -- ver BOT_MODE más abajo. Corre CADA HORA. NUNCA
    # escanea ni abre nuevas entradas. El Stop Loss en break even NO se
    # ejecuta desde aquí (ver RUN_STOP_LOSS_CHECK).
    - cron: "0 * * * *"

permissions:
  contents: write  # necesario para guardar los archivos de la carpeta json/

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: bingx-trading-bot
      cancel-in-progress: false

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r utils/requirements.txt

      - name: Ejecutar bot
        env:
          BINGX_API_KEY: ${{ secrets.BINGX_API_KEY }}
          BINGX_API_SECRET: ${{ secrets.BINGX_API_SECRET }}
          BINGX_DEMO_SHORT: ${{ github.event.inputs.demo_mode_short || vars.BINGX_DEMO_SHORT || 'true' }}
          BINGX_DEMO_LONG: ${{ github.event.inputs.demo_mode_long || vars.BINGX_DEMO_LONG || 'true' }}
          BINGX_LOW_RISK: ${{ vars.BINGX_LOW_RISK || 'true' }}
          BOT_MODE: ${{ github.event_name == 'schedule' && 'tp_only' || 'full' }}
          RUN_BALANCE_CHECK: ${{ github.event_name == 'repository_dispatch' && 'true' || 'false' }}
          RUN_STOP_LOSS_CHECK: ${{ github.event_name == 'repository_dispatch' && 'true' || 'false' }}
        run: |
          set -o pipefail
          python bingx_bot.py 2>&1 | tee bot_output.log

      - name: Guardar seguimiento (carpeta json/)
        if: always()
        run: |
          if [ -n "$(git status --porcelain json/)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add json/
            git commit -m "chore: actualizar seguimiento json [skip ci]"
            for i in 1 2 3; do
              git pull --rebase origin "${{ github.ref_name }}" && git push && break
              sleep 3
            done || echo "No se pudo hacer push del registro"
          fi

      - name: Enviar entradas, TP/BE y errores a Telegram
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EVENTO: ${{ github.event_name }}
        run: |
          rm -f signals.txt

          # Solo se avisa de: entradas, TP, break even, órdenes canceladas/llenadas,
          # barrido de balance, bloqueos de riesgo y ERRORES / fallos de API.
          # YA NO se manda el RESUMEN del escáner de cada corrida.
          grep -E "Market entry executed|(STOP-)?LIMIT order placed|Orden límite LONG cancelada|\[LONG\]: la orden límite se llenó|Stop Loss en break even.*colocado|Take Profit colocado|Take Profit adjunto LÍMITE aceptado|Barrido de balance\] Transferencia ejecutada|no aceptó la entrada con Take Profit|no aceptó el TP adjunto|\[Límite de riesgo\] (BLOQUEADA|ADVERTENCIA)|\[Entrada descartada\]|no se pudo cancelar|BingX rechazó|no se pudo configurar el apalancamiento|no se pudo verificar|no se pudieron obtener las órdenes abiertas|Datos insuficientes de OHLCV|\[DIAGNÓSTICO\]|\[ERROR\]" bot_output.log \
            | grep -v "Error evaluando" > signals.txt || true

          # Caída por excepción no controlada
          if grep -q "Traceback" bot_output.log; then
            {
              echo "💥 El bot se cayó con una excepción no controlada:"
              grep -A 15 "Traceback" bot_output.log
            } >> signals.txt
          fi

          if [ ! -s signals.txt ]; then
            echo "Telegram: nada que avisar en esta corrida"
            exit 0
          fi

          # Contexto en cada mensaje: versión de ccxt, Python, modo y hora
          VER=$(grep -o 'ccxt=[0-9][0-9.]*' bot_output.log | head -1)
          PYV=$(python --version 2>&1)
          FECHA=$(date -u '+%Y-%m-%d %H:%M UTC')
          HEADER="📊 BingX Bot | ${VER:-ccxt=?} | ${PYV} | ${EVENTO} | ${FECHA}"

          # Telegram rechaza mensajes de más de 4096 caracteres: máx. 4 bloques
          rm -f part_*
          split -C 3500 -d signals.txt part_
          TOTAL=$(ls part_* | wc -l)
          for f in $(ls part_* | head -4); do
            TEXT=$(printf '%s\n%s' "${HEADER}" "$(cat "$f")")
            RESP=$(curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
              --data-urlencode "text=${TEXT}")
            echo "Telegram: ${RESP}"
          done
          if [ "${TOTAL}" -gt 4 ]; then
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
              --data-urlencode "text=⚠️ Hubo más de 4 bloques de avisos; se omitieron $((TOTAL-4)). Revisa el log en GitHub." > /dev/null
          fi