name: BingX Trading Bot - Pasos 1 a 13

on:
  repository_dispatch:
    types: [bingx-trigger]
  workflow_dispatch:
    inputs:
      demo_mode:
        description: "Ejecutar en cuenta DEMO (VST) en vez de cuenta real"
        required: true
        type: boolean
        default: true

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar bot
        env:
          BINGX_API_KEY: ${{ secrets.BINGX_API_KEY }}
          BINGX_API_SECRET: ${{ secrets.BINGX_API_SECRET }}
          BINGX_DEMO: ${{ github.event.inputs.demo_mode || vars.BINGX_DEMO || 'true' }}
        run: |
          set -o pipefail
          python bingx_bot.py 2>&1 | tee bot_output.log

      - name: Enviar señales a Telegram
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          grep -E "Market entry executed|Short STOP-LIMIT order placed" bot_output.log > signals.txt || true
          if [ -s signals.txt ]; then
            MSG=$(cat signals.txt)
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
              --data-urlencode "text=📊 BingX Bot:
          ${MSG}"
          fi