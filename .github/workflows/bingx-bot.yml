name: BingX Trading Bot - Pasos 1 a 14

on:
  repository_dispatch:
    types: [bingx-trigger]
  workflow_dispatch:
    inputs:
      demo_mode_short:
        description: "Ejecutar la estrategia SHORT en cuenta DEMO (VST) en vez de cuenta real"
        required: true
        type: boolean
        default: false
      demo_mode_long:
        description: "Ejecutar la estrategia LONG en cuenta DEMO (VST) en vez de cuenta real"
        required: true
        type: boolean
        default: true
  schedule:
    # Cron INTERNO de GitHub, dedicado EXCLUSIVAMENTE a la gestión de
    # TP/SL (Paso 1) -- ver BOT_MODE más abajo. Corre CADA HORA, en
    # sintonía con TIMEFRAME_TP="1h" en bingx_bot.py. NUNCA escanea ni
    # abre nuevas entradas (ninguna de las dos direcciones), así se
    # evita duplicar una posición que el disparador externo
    # (cronjob.org -> repository_dispatch) ya haya abierto.
    #
    # IMPORTANTE (Stop Loss): este cron interno de GitHub NO es
    # puntual -- schedule puede sufrir retrasos frente al minuto
    # exacto configurado. Por eso el Stop Loss (Gatillo 2 del Paso 1)
    # ya NO se coloca desde este disparador -- ver RUN_STOP_LOSS_CHECK
    # más abajo. El Take Profit (Gatillo 1) sigue evaluándose aquí sin
    # cambios, para ambas cuentas (short y long).
    #
    # NOTA -- EXPERIMENTO REVERSAL LONG: bingx_bot.py revisa las
    # señales pendientes (vela A/vela B, ver long_reversal.py) en
    # TODAS las corridas, incluida esta cron horaria -- de hecho es
    # la que más importa para no perderse la ventana de la vela B,
    # que también es de 1h.
    - cron: "0 * * * *"

# NUEVO: necesario para que el paso "Guardar estado de REVERSAL LONG"
# pueda hacer `git push` de vuelta al repo con el JSON de señales
# pendientes actualizado.
permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # IMPORTANTE: serializa las ejecuciones de este workflow. Sin esto,
    # el cron interno (schedule) y el disparador externo (cronjob.org
    # -> repository_dispatch) podrían caer en el mismo instante y correr
    # EN PARALELO -- ambos verificarían "¿ya existe el TP/SL?" casi al
    # mismo tiempo, verían que no, y crearían la orden duplicada de
    # todos modos. `cancel-in-progress: false` hace que la segunda
    # ejecución espere en cola a que termine la primera. Esto también
    # evita conflictos de `git push` al commitear el estado del
    # experimento REVERSAL LONG (ver más abajo).
    concurrency:
      group: bingx-trading-bot
      cancel-in-progress: false

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r utils/requirements.txt

      - name: Ejecutar bot
        env:
          BINGX_API_KEY: ${{ secrets.BINGX_API_KEY }}
          BINGX_API_SECRET: ${{ secrets.BINGX_API_SECRET }}
          # Antes: una sola BINGX_DEMO para toda la cuenta. Ahora, DOS
          # variables independientes -- una por dirección de la
          # estrategia -- para poder tener, por ejemplo, la SHORT (ya
          # probada) en real mientras la LONG (más nueva) sigue en
          # demo por más tiempo.
          BINGX_DEMO_SHORT: ${{ github.event.inputs.demo_mode_short || vars.BINGX_DEMO_SHORT || 'true' }}
          BINGX_DEMO_LONG: ${{ github.event.inputs.demo_mode_long || vars.BINGX_DEMO_LONG || 'true' }}
          # El cron interno (schedule) SOLO gestiona TP/SL (Paso 1),
          # en ambas cuentas, y el seguimiento de señales pendientes
          # del experimento REVERSAL LONG. Cualquier otro disparador --
          # manual (workflow_dispatch) o externo (repository_dispatch
          # desde cronjob.org) -- corre el bot completo (Pasos 1 a 14,
          # en ambas direcciones), además del mismo seguimiento.
          BOT_MODE: ${{ github.event_name == 'schedule' && 'tp_only' || 'full' }}
          # Barrido de balance de futuros -> fondos (ver
          # check_and_sweep_futures_balance en bingx_bot.py, evaluado
          # por separado para cada cuenta): SOLO debe correr cuando el
          # disparador es el EXTERNO (cronjob.org -> repository_dispatch).
          RUN_BALANCE_CHECK: ${{ github.event_name == 'repository_dispatch' && 'true' || 'false' }}
          # Gatillo del Stop Loss (Gatillo 2 del Paso 1, toque de la
          # EMA50(1h)): SOLO se activa cuando el disparador es el
          # EXTERNO (cronjob.org -> repository_dispatch). El Take
          # Profit (Gatillo 1) NO usa esta variable: sigue
          # evaluándose siempre, sin importar el disparador.
          RUN_STOP_LOSS_CHECK: ${{ github.event_name == 'repository_dispatch' && 'true' || 'false' }}
        run: |
          set -o pipefail
          python bingx_bot.py 2>&1 | tee bot_output.log

      - name: Guardar estado de REVERSAL LONG (json/long_candidates.json)
        # NUEVO: el JSON con las señales pendientes del experimento
        # REVERSAL LONG (ver long_reversal.py) se escribe en el disco
        # efímero del runner, dentro de la carpeta json/ (creada sola
        # por long_reversal._save_state() si no existe) -- si no se
        # commitea de vuelta al repo, se pierde al terminar el job y
        # el bot "olvidaría" las señales pendientes en la siguiente
        # corrida. `if: always()` asegura que esto corra incluso si
        # el paso "Ejecutar bot" falló a mitad de camino, para no
        # perder cambios de estado ya hechos.
        if: always()
        run: |
          if [ -f json/long_candidates.json ] && [ -n "$(git status --porcelain json/long_candidates.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add json/long_candidates.json
            git commit -m "chore: actualizar estado de señales pendientes REVERSAL LONG [skip ci]"
            git push
          else
            echo "Sin cambios en json/long_candidates.json, no se commitea nada."
          fi

      - name: Enviar señales a Telegram
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          # NOTA: el patrón de "Stop Loss" usa ".*" entre "break even" y
          # "colocado" porque el log real dice "Stop Loss en break even
          # EXACTO colocado (gatillo: ...)". El patrón de "Transferencia
          # ejecutada" notifica el barrido de balance de futuros -> fondos
          # (de cualquiera de las dos cuentas, short o long). El patrón
          # "REVERSAL LONG.*Market entry executed" notifica las entradas
          # del nuevo experimento.
          grep -E "Market entry executed|STOP-LIMIT order placed|Take Profit colocado|Stop Loss en break even.*colocado|Barrido de balance\] Transferencia ejecutada" bot_output.log > signals.txt || true
          if [ -s signals.txt ]; then
            MSG=$(cat signals.txt)
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
              --data-urlencode "text=📊 BingX Bot:
          ${MSG}"
          fi